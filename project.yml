name: Raices
options:
  bundleIdPrefix: com.alemarcheco
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Raices:
    type: application
    platform: iOS
    sources:
      - Raices
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alemarcheco.arbolgenealogico
        PRODUCT_NAME: Raices
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Raices/Info.plist
    info:
      path: Raices/Info.plist
      properties:
        CFBundleDisplayName: "Raíces"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        NSPhotoLibraryUsageDescription: "Para añadir fotos a las personas de tu árbol."
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.alemarcheco.raices.gedcom
            UTTypeDescription: "Árbol genealógico GEDCOM"
            UTTypeConformsTo: [public.data, public.text]
            UTTypeTagSpecification:
              public.filename-extension: [ged, GED, gedcom]
              public.mime-type: [application/x-gedcom, text/vnd.familysearch.gedcom]
        CFBundleDocumentTypes:
          - CFBundleTypeName: "Árbol genealógico GEDCOM"
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.alemarcheco.raices.gedcom]
          - CFBundleTypeName: "Archivo ZIP"
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.zip-archive]
